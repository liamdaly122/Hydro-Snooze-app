[project]
name = "hydrosnooze"
version = "0.1.0"
description = "Local control for the HydroSnooze HS1001, over infrared and a smart plug."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed once the infrared blaster exists. Keeping it out of the base
# install means a Pi Zero, or a Mac just running the simulation, does not have to
# build it.
hardware = ["aioesphomeapi>=24.6"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hydrosnooze*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
