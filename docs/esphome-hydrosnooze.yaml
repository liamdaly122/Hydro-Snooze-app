# ESPHome configuration for the XIAO Smart IR Mate.
#
# Step two of two. One thing left to fill in: the eight captured codes.
#
# Flash docs/esphome-capture.yaml first, press each remote button at it, and
# write down what the log says. Then put those values in below.
#
# The pins are real, taken from Seeed's own configuration for this board rather
# than guessed. GPIO3 transmits, GPIO4 receives:
# https://github.com/Seeed-Studio/xiao-esphome-projects/blob/main/projects/xiao_smart_ir_mate/xiao_smart_ir_mate.yaml
#
# The board ships pre-flashed with Seeed's configuration. Flashing this replaces
# it, which also means the touch button and the vibration motor stop doing
# anything. Neither is used here.
#
# The service looks for one button entity per remote button, with these exact
# names: power, schedule, temp_up, temp_down, cool, warm, timer, mute.

esphome:
  name: hydrosnooze-ir
  friendly_name: HydroSnooze IR

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
api:
  encryption:
    # Generate with: openssl rand -base64 32
    key: !secret hydrosnooze_api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 50%

# --- The eight buttons --------------------------------------------------------
#
# If the codes decoded as a named protocol such as NEC, use the protocol block
# below and record the address and command. That is far more reliable than raw
# timings. If they only came out as raw, use the raw form instead.

button:
  - platform: template
    name: power
    id: btn_power
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x0000   # TODO
          command: 0x0000   # TODO

  - platform: template
    name: schedule
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: temp_up
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: temp_down
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: cool
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: warm
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: timer
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

  - platform: template
    name: mute
    on_press:
      - remote_transmitter.transmit_nec: { address: 0x0000, command: 0x0000 }  # TODO

# --- If the codes did not decode as a named protocol ---------------------------
#
# Raw timings work too, they are just uglier. Replace the transmit_nec action
# with the list the capture log printed:
#
#   - platform: template
#     name: power
#     on_press:
#       - remote_transmitter.transmit_raw:
#           carrier_frequency: 38kHz
#           code: [4470, -4370, 600, -1580, 600, -480, ...]
#
# --- Keeping the light working -------------------------------------------------
#
# Seeed wires the RGB LED to GPIO7. Not needed, but it is the only way to see
# from across the room that the board is up and on the Wi-Fi.
#
