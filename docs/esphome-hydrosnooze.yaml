# ESPHome configuration for the XIAO Smart IR Mate.
#
# Step two of two, and this one is filled in. The eight codes below are the real
# ones, captured off my own HydroSnooze remote on 7 September, three agreeing
# presses each, nothing inconsistent across the set.
#
#   ~/esphome/bin/esphome run docs/esphome-hydrosnooze.yaml
#
# The pins are real, taken from Seeed's own configuration for this board rather
# than guessed. GPIO3 transmits, GPIO4 receives:
# https://github.com/Seeed-Studio/xiao-esphome-projects/blob/main/projects/xiao_smart_ir_mate/xiao_smart_ir_mate.yaml
#
# The board ships pre-flashed with Seeed's configuration. Flashing this replaces
# it, which also means the touch button and the vibration motor stop doing
# anything. Neither is used here.
#
# The service looks for one button entity per remote button, with these exact
# names: power, schedule, temp_up, temp_down, cool, warm, timer, mute.

substitutions:
  # How many times one press is sent, and the extra gap between sends.
  #
  # These are the only two numbers here worth touching. The real remote sends the
  # frame 8 to 12 times per tap, about 8.3ms apart, and the unit still moves one
  # step, so it clearly ignores repeats inside a burst. These defaults copy that.
  #
  # If a press does nothing at all, raise ir_frames.
  # If one press moves the temperature by more than one degree, the unit is
  # counting frames rather than ignoring them: drop ir_frames to 1 and work up.
  ir_frames: "8"
  ir_gap: 1500us

esphome:
  name: hydrosnooze-ir
  friendly_name: HydroSnooze IR

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
api:
  encryption:
    # Generate with: openssl rand -base64 32
    key: !secret hydrosnooze_api_key
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 50%

# --- The eight buttons --------------------------------------------------------
#
# Symphony, 12 bits, 38kHz carrier. Every code shares the top nibble 0xD, which
# is the remote's address, and no two buttons share a code.
#
# Measured off the capture, against what ESPHome's Symphony encoder sends:
#
#                     remote          ESPHome
#   bit 1 mark        1262-1315us     1260us
#   bit 0 mark         421-447us       460us
#   bit time          constant 1710us  constant 1720us
#   carrier           38.0kHz          38.0kHz
#
# Close enough that the receiver decoded every press first time. The one place
# they differ is the gap between repeats, which is why the burst is built out of
# single frames above rather than left to ESPHome's own 34.76ms spacing.

button:
  - platform: template
    name: power
    id: btn_power
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xDD2
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: schedule
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD94
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: temp_up
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD82
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: temp_down
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xDC3
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: cool
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD84
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: warm
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xDB2
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  - platform: template
    name: timer
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD81
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

  # Sent by hand once, from the app's Status card, and never automatically.
  # The unit remembers the setting through a power cut, so this is a toggle
  # rather than a command.
  - platform: template
    name: mute
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD88
          nbits: 12
          command_repeats: 1
          repeat:
            times: ${ir_frames}
            wait_time: ${ir_gap}

