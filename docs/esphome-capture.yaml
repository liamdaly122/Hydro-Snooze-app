# Step one of two: listen, and write down what the remote says.
#
# Flash this as it is. Nothing needs filling in. It turns the IR Mate into a
# receiver that prints every code it hears, and does nothing else.
#
# Flash it, over USB:
#
#   ~/esphome/bin/esphome run docs/esphome-capture.yaml
#
# It streams the log straight after. Ctrl-C when you want out, then reconnect any
# time with a copy saved to the Desktop, which is the thing to paste back:
#
#   ~/esphome/bin/esphome logs docs/esphome-capture.yaml | tee ~/Desktop/ir-capture.txt
#
# Then point the HydroSnooze remote at it from about 10cm and press each of the
# eight buttons once, slowly, watching the log. Press ONE button first and check
# something appears at all before doing the other seven: nothing at all means the
# distance, the aim or the flash is wrong, and there is no point capturing eight
# of nothing.
#
# Press each button two or three times. The same button must give the same code
# every time. If it does not, you are too close, too far, or off to one side.
#
# Pins are from Seeed's own configuration for this board, not guessed:
# https://github.com/Seeed-Studio/xiao-esphome-projects/blob/main/projects/xiao_smart_ir_mate/xiao_smart_ir_mate.yaml

esphome:
  name: hydrosnooze-ir
  friendly_name: HydroSnooze IR

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Nothing else needs to reach it while it is only listening, so no api block:
# the log over USB is the whole point of this file.
ota:
  - platform: esphome

remote_receiver:
  pin:
    number: GPIO4
    inverted: true
  # Air conditioner remotes send long frames. A generous idle keeps one press
  # from being chopped into several, and a bigger buffer keeps the tail of a long
  # code from being thrown away.
  #
  # rmt_symbols, not buffer_size: on the esp-idf framework buffer_size does
  # nothing, and the default of 96 symbols is where a long frame gets truncated.
  # 192 is the ESP32-C3's whole RMT block, which this config can have because
  # nothing here is transmitting.
  idle: 25ms
  rmt_symbols: 192
  tolerance: 55%
  # Decode as every protocol it knows, and print the raw timings either way.
  dump: all
